[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-ai-trader"
version = "1.9.21"
description = "نرم‌افزار دسکتاپ تحلیل بازار ارز دیجیتال و تولید سیگنال Futures با کمک هوش مصنوعی"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Crypto AI Trader Team" }]
keywords = ["crypto", "trading", "technical-analysis", "ai-agent", "lbank", "pyside6"]

dependencies = [
  "PySide6>=6.9.1,<7.0",
  "pyqtgraph>=0.13.7,<0.15",
  "SQLAlchemy>=2.0.30,<3.0",
  "alembic>=1.13.0,<2.0",
  "pandas>=2.2.0,<3.0",
  "numpy>=1.26.0,<3.0",
  "httpx>=0.27.0,<1.0",
  "websockets>=13.0,<16.0",
  "pydantic>=2.7.0,<3.0",
  "pydantic-settings>=2.3.0,<3.0",
  "keyring>=25.0.0,<26.0",
  "cryptography>=42.0.0,<51.0",
  "openpyxl>=3.1.0,<4.0",
  "arabic-reshaper>=3.0.0,<4.0",
  "python-bidi>=0.4.2,<1.0",
  "reportlab>=4.1.0,<5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0,<10.0", "pytest-asyncio>=0.23.0,<2.0", "pyinstaller>=6.6.0,<8.0"]

[project.scripts]
crypto-ai-trader = "main:main"

[tool.setuptools]
packages = ["app", "ui", "market", "indicators", "ai", "signals", "reports", "backup", "localization"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"
